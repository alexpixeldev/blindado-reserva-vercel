<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Controle de Locação</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<form id="locacaoForm" class="form-container">
  <div class="form-header-container">
    <div class="form-logo">
      <img src="logo-topo.png" alt="Logo Blindado">    </div>
    <div class="form-title">FICHA PARA CONTROLE DE LOCAÇÃO</div>
  </div>

  <div class="form-section">
    <h2 class="section-title">Informações do Edifício</h2>
    <div class="row">
      <div class="col">
        <label>Nome do Edifício:</label>
        <input type="text" name="edificio" id="edificioInput" placeholder="Clique para inserir o edifício" required>
      </div>
      <div class="col">
        <label>Número do Apartamento:</label>
        <input type="text" name="apartamento" placeholder="Digite o apartamento" required>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2 class="section-title">Informações do Responsável</h2>
    <div class="row">
      <div class="col">
        <label>Nome do Responsável:</label>
        <input type="text" name="responsavel" placeholder="Nome do ocupante responsável" required oninput="updateResponsiblePerson()">
      </div>
      <div class="col">
        <label>Telefone:</label>
        <input type="tel" name="telefone" placeholder="(00) 00000-0000" required oninput="formatPhone(this); updateResponsiblePerson()">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>CPF:</label>
        <input type="text" name="cpf" maxlength="14" placeholder="Digite o CPF sem pontuação" oninput="formatCPF(this); updateResponsiblePerson()">
      </div>
      <div class="col">
        <label>RG:</label>
        <input type="text" name="rg" placeholder="Ex: 123456-ES" oninput="updateResponsiblePerson()">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Endereço:</label>
        <input type="text" name="endereco">
      </div>
      <div class="col">
        <label>Número:</label>
        <input type="text" name="numero">
      </div>
      <div class="col">
        <label>Bairro:</label>
        <input type="text" name="bairro">
      </div>
      <div class="col">
        <label>Cidade:</label>
        <input type="text" name="cidade">
      </div>
      <div class="col">
        <label>UF:</label>
        <input type="text" name="uf">
      </div>
    </div>
  </div>


  <div id="vehicleSection" class="form-section">
    <h2 class="section-title">Informações do Veículo</h2>
    <div id="vehicleContainer"></div>
    <button type="button" class="add-vehicle">ADICIONAR VEÍCULO</button>
  </div>

  <div class="form-section">
    <h2 class="section-title">Data de Chegada e Saída</h2>
    <div class="row">
      <div class="col">
        <label>Data de Chegada:</label>
        <input type="date" name="chegada" id="dataChegada" required>
      </div>
      <div class="col">
        <label>Data de Saída:</label>
        <input type="date" name="saida" id="dataSaida" required>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2 class="section-title">Lista de Pessoas e Documentos</h2>
    <div id="peopleContainer">
      <div class="person-row responsible">
        <div class="col"><label>Nome:</label><input type="text" name="responsiblePersonName" readonly></div>
        <div class="col"><label>Documento:</label><input type="text" name="responsiblePersonDoc" readonly></div>
        <div class="col">
          <label>Criança:</label>
          <label class="switch">
            <input type="checkbox" disabled>
            <span class="slider"></span>
          </label>
        </div>
        <div class="col">
          <button type="button" class="remove-button" disabled style="visibility: hidden;">REMOVER</button>
        </div>
      </div>
    </div>
    <button type="button" class="add-person">ADICIONAR PESSOA</button>
  </div>

  <div class="form-section">
    <h2 class="section-title">Condição do imóvel</h2>
    <div class="radio-group">
      <label><input type="radio" name="tipoLocacao" value="Emprestado" required> Emprestado</label>
      <label><input type="radio" name="tipoLocacao" value="Alugado pelo proprietário"> Alugado pelo proprietário</label>
      <label><input type="radio" name="tipoLocacao" value="Alugado pela imobiliária"> Alugado pela imobiliária</label>
    </div>
  </div>

  <div class="button-group">
    <button type="button" class="finalizarBtn">FINALIZAR</button>
  </div>
</form>

<div id="edificioSelectionModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); align-items: center; justify-content: center;">
  <div style="background-color: #fefefe; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 10px; max-height: 90vh; overflow-y: auto;">
    <h2>Selecione o Edifício</h2>
    <div id="edificioList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px;"></div>
  </div>
</div>

<div id="reviewPage" class="form-container">
  <div class="form-header-container">
    <div class="form-logo">
      <img src="logo-topo.png" alt="Logo Blindado">
    </div>
    <div class="form-title">FICHA PARA CONTROLE DE LOCAÇÃO</div>
  </div>

  <div id="reviewContent"></div>



  <div class="button-group">
    <button type="button" class="encaminharBtn full-width-btn"><i class="fa-brands fa-whatsapp"></i> ENCAMINHAR</button>
    <div class="button-row">
      <button type="button" class="printBtn">IMPRIMIR</button>
      <button type="button" class="backToFormBtn">VOLTAR E EDITAR</button>
      <button type="button" class="whatsappBtn"><i class="fa-brands fa-whatsapp"></i> ENVIAR PARA A BLINDADO</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
